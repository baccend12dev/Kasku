name: Build & Release KasKu APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag versi rilis GitHub (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            echo "BUILD_VARIANT=release" >> "$GITHUB_ENV"
          else
            base64 -d debug.keystore.base64 > debug.keystore
            echo "BUILD_VARIANT=debug" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"
          if [ "$BUILD_VARIANT" = "release" ]; then
            gradle :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk "KasKu-${TAG_NAME}.apk"
          else
            gradle :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "KasKu-${TAG_NAME}.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KasKu-${{ env.RELEASE_TAG }}-apk
          path: KasKu-${{ env.RELEASE_TAG }}.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: KasKu ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: KasKu-${{ env.RELEASE_TAG }}.apk
